<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img" aria-label="Layout 模块边界和数据流">
<title>Layout 模块边界和数据流</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033} .small{font-size:13px} .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px}</style>
<rect width="1080" height="630" rx="14" fill="#fff"/>
<text x="28" y="32" font-size="21" text-anchor="start" font-weight="600" style="fill:#172033">01 · Layout 的三个职责</text>
<text x="28" y="57" font-size="14" text-anchor="start" font-weight="normal" style="fill:#64748b">蓝色：逻辑元数据；绿色：HBM 几何；橙色：外存模板；灰色：模块外部</text>
<rect x="20" y="88" width="1040" height="355" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
<text x="38" y="114" font-size="16" text-anchor="start" font-weight="600" style="fill:#172033">layout 目录：不接收请求、plan 或 hash keys</text>
<rect x="40" y="145" width="280" height="153" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="56" y="174" font-size="17" text-anchor="start" font-weight="600" style="fill:#2563eb">配置元数据</text>
<line x1="40" y1="189" x2="320" y2="189" stroke="#2563eb" opacity=".25"/>
<text x="56" y="212" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">KVCacheConfig → Spec/GroupInfo</text>
<text x="56" y="234" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">原生存取标志 / kind / token span</text>
<text x="56" y="256" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">持久 group 的 State / tail 规则</text>
<rect x="400" y="145" width="280" height="153" rx="10" fill="#ecfdf5" stroke="#059669"/>
<text x="416" y="174" font-size="17" text-anchor="start" font-weight="600" style="fill:#059669">HBM 布局</text>
<line x1="400" y1="189" x2="680" y2="189" stroke="#059669" opacity=".25"/>
<text x="416" y="212" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">worker spec + descriptor + views</text>
<text x="416" y="234" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">LayerView → Component → Segment</text>
<text x="416" y="256" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">ptr / stride / payload / BlockAccess</text>
<rect x="760" y="145" width="280" height="153" rx="10" fill="#fff7ed" stroke="#ea580c"/>
<text x="776" y="174" font-size="17" text-anchor="start" font-weight="600" style="fill:#ea580c">外存布局</text>
<line x1="760" y1="189" x2="1040" y2="189" stroke="#ea580c" opacity=".25"/>
<text x="776" y="212" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">GroupStoreLayout</text>
<text x="776" y="234" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">offsets / sizes / store_bytes</text>
<text x="776" y="256" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">通用模板 或 Block First bulk</text>
<polyline points="320,217 400,217" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="360" y="205" font-size="13" text-anchor="middle" font-weight="normal" style="fill:#475569">策略</text>
<polyline points="680,217 760,217" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="720" y="205" font-size="13" text-anchor="middle" font-weight="normal" style="fill:#475569">几何</text>
<rect x="245" y="338" width="590" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="261" y="367" font-size="17" text-anchor="start" font-weight="600" style="fill:#7c3aed">UCMKVCacheLayout</text>
<line x1="245" y1="382" x2="835" y2="382" stroke="#7c3aed" opacity=".25"/>
<text x="261" y="405" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">spec + group_layouts + store_layouts + 层索引</text>
<polyline points="180,298 180,365 245,365" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<polyline points="540,298 540,338" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<polyline points="900,298 900,365 835,365" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="40" y="492" width="275" height="108" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="56" y="521" font-size="17" text-anchor="start" font-weight="600" style="fill:#64748b">Scheduler（外部）</text>
<line x1="40" y1="536" x2="315" y2="536" stroke="#64748b" opacity=".25"/>
<text x="56" y="559" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">请求 / keys / block tables</text>
<text x="56" y="581" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">生成 dispatch plan</text>
<rect x="403" y="492" width="305" height="108" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="419" y="521" font-size="17" text-anchor="start" font-weight="600" style="fill:#64748b">TransferBuilder（外部）</text>
<line x1="403" y1="536" x2="708" y2="536" stroke="#64748b" opacity=".25"/>
<text x="419" y="559" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">plan + Layout → [K,S] 矩阵</text>
<text x="419" y="581" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">关联 key；累计 group 存储起点</text>
<rect x="795" y="492" width="245" height="108" rx="10" fill="#f1f5f9" stroke="#64748b"/>
<text x="811" y="521" font-size="17" text-anchor="start" font-weight="600" style="fill:#64748b">Connector / Proxy</text>
<line x1="795" y1="536" x2="1040" y2="536" stroke="#64748b" opacity=".25"/>
<text x="811" y="559" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">提交 / wait / commit</text>
<text x="811" y="581" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">实际字节搬运</text>
<polyline points="315,548 403,548" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="359" y="536" font-size="13" text-anchor="middle" font-weight="normal" style="fill:#475569">plan</text>
<polyline points="708,548 795,548" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="751" y="536" font-size="13" text-anchor="middle" font-weight="normal" style="fill:#475569">Transfer</text>
<polyline points="555,418 555,492" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="600" y="467" font-size="13" text-anchor="middle" font-weight="normal" style="fill:#475569">布局查询</text>
</svg>