<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="645" viewBox="0 0 1120 645" role="img" aria-label="HBM 指针与外存 offset 的区别">
<title>HBM 指针与外存 offset 的区别</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033} .small{font-size:13px} .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px}</style>
<rect width="1120" height="645" rx="14" fill="#fff"/>
<text x="28" y="32" font-size="21" text-anchor="start" font-weight="600" style="fill:#172033">06 · HBM 的绝对地址 ≠ 外存的相对 offset</text>
<text x="28" y="57" font-size="14" text-anchor="start" font-weight="normal" style="fill:#64748b">继续使用 tail12 示例。group 内顺序：旧 block 的 L0/L1，再是新 block 的 L0/L1。</text>
<rect x="35" y="98" width="475" height="190" rx="10" fill="#ecfdf5" stroke="#059669"/>
<text x="51" y="127" font-size="17" text-anchor="start" font-weight="600" style="fill:#059669">HBM：本次源地址（key0）</text>
<line x1="35" y1="142" x2="510" y2="142" stroke="#059669" opacity=".25"/>
<text x="51" y="165" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">旧 b3 L0: ptr1112，size16</text>
<text x="51" y="187" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">旧 b3 L1: ptr2056，size8</text>
<text x="51" y="209" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">新 b4 L0: ptr1128，size32</text>
<text x="51" y="231" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">新 b4 L1: ptr2064，size16</text>
<rect x="610" y="98" width="475" height="190" rx="10" fill="#fff7ed" stroke="#ea580c"/>
<text x="626" y="127" font-size="17" text-anchor="start" font-weight="600" style="fill:#ea580c">外存：本组固定模板</text>
<line x1="610" y1="142" x2="1085" y2="142" stroke="#ea580c" opacity=".25"/>
<text x="626" y="165" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">sizes=[[16,8],[32,16]]</text>
<text x="626" y="187" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">cumsum=[16,24,56,72]</text>
<text x="626" y="209" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">减当前size → offsets=[0,16,24,56]</text>
<text x="626" y="231" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">store_bytes=72</text>
<polyline points="510,195 610,195" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="560" y="183" font-size="13" text-anchor="middle" font-weight="normal" style="fill:#475569">映射</text>
<text x="35" y="344" font-size="18" text-anchor="start" font-weight="600" style="fill:#172033">一个 key 的本组外存值：</text>
<rect x="35" y="372" width="190" height="65" rx="3" fill="#bfdbfe" stroke="#94a3b8"/>
<text x="131" y="409" font-size="15" text-anchor="middle" font-weight="normal" style="fill:#172033">旧L0 16B</text>
<rect x="227" y="372" width="94" height="65" rx="3" fill="#fde68a" stroke="#94a3b8"/>
<text x="275" y="409" font-size="15" text-anchor="middle" font-weight="normal" style="fill:#172033">旧L1 8B</text>
<rect x="323" y="372" width="382" height="65" rx="3" fill="#a7f3d0" stroke="#94a3b8"/>
<text x="515" y="409" font-size="15" text-anchor="middle" font-weight="normal" style="fill:#172033">新L0 32B</text>
<rect x="707" y="372" width="190" height="65" rx="3" fill="#fed7aa" stroke="#94a3b8"/>
<text x="803" y="409" font-size="15" text-anchor="middle" font-weight="normal" style="fill:#172033">新L1 16B</text>
<text x="35" y="459" font-size="14" text-anchor="middle" font-weight="normal" style="fill:#172033">0</text>
<text x="227" y="459" font-size="14" text-anchor="middle" font-weight="normal" style="fill:#172033">16</text>
<text x="323" y="459" font-size="14" text-anchor="middle" font-weight="normal" style="fill:#172033">24</text>
<text x="707" y="459" font-size="14" text-anchor="middle" font-weight="normal" style="fill:#172033">56</text>
<text x="899" y="459" font-size="14" text-anchor="middle" font-weight="normal" style="fill:#172033">72</text>
<rect x="35" y="497" width="1050" height="99" rx="10" fill="#fff7ed" stroke="#ea580c"/>
<text x="51" y="526" font-size="17" text-anchor="start" font-weight="600" style="fill:#ea580c">只选择 L1：不重新打包</text>
<line x1="35" y1="541" x2="1085" y2="541" stroke="#ea580c" opacity=".25"/>
<text x="51" y="564" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">offsets=[16,56]；sizes=[8,16]；ptrs=[2056,2064]；本组 store_bytes 仍为72</text>
<text x="51" y="586" font-size="14" text-anchor="start" font-weight="normal" style="fill:#172033">下一个 group 的起点由外部 TransferBuilder 加72，而不是按本次 IO 字节数加24。</text>
</svg>